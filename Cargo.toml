[workspace]
resolver = "2"
members = ["crates/agg2d", "crates/clamp", "crates/envelope", "crates/dsp", "crates/engine", "crates/gfx", "crates/presets", "crates/qfc", "crates/render", "crates/shaperbox", "crates/ui", "plugin", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
backspin-agg2d = { path = "crates/agg2d" }
backspin-clamp = { path = "crates/clamp" }
backspin-dsp = { path = "crates/dsp" }
backspin-engine = { path = "crates/engine" }
backspin-gfx = { path = "crates/gfx" }
backspin-presets = { path = "crates/presets" }
backspin-qfc = { path = "crates/qfc" }
backspin-envelope = { path = "crates/envelope" }
backspin-render = { path = "crates/render" }
backspin-ui = { path = "crates/ui" }
backspin-shaperbox = { path = "crates/shaperbox" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
